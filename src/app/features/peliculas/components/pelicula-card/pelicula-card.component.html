<article class="pelicula-card">
  <div class="pelicula-info">
    <div class="poster-wrap">
      <img [src]="peliculaRecibida.imagen" [alt]="peliculaRecibida.nombre" />
      <span class="availability" [class.soon]="!peliculaRecibida.estaDisponible">
        {{ peliculaRecibida.estaDisponible ? 'EN CARTELERA' : 'PRÓXIMAMENTE' }}
      </span>
      <span class="age-rating">+{{ peliculaRecibida.clasificacionEdad }}</span>
    </div>
    <div class="card-content">
      <div class="movie-meta">
        <span>{{ peliculaRecibida.genero }}</span>
        <span>{{ peliculaRecibida.duracion }} min</span>
      </div>
      <h2>{{ peliculaRecibida.nombre }}</h2>
      <p class="movie-synopsis">{{ peliculaRecibida.sinopsis }}</p>
      <button (click)="emitirSeleccion()">Ver detalle <span aria-hidden="true">→</span></button>
    </div>
  </div>
</article>
